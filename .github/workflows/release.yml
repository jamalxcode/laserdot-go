name: Release
# Releases itself: when CI passes on main and CHANGELOG.md's newest version
# has no release yet, this builds Laserdot.app from exactly that commit,
# packs it as Laserdot-<version>.dmg, checks that it launches, and publishes
# it (where the Laserdot Updater finds it). A tag push or a run by hand with
# a version still work.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.2.0'
        required: true
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  decide:
    # After CI: only a passing run for a push to main.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      go: ${{ steps.v.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ github.event.inputs.version }}"
          if [ "${{ github.event_name }}" = push ]; then v="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$v" ]; then v=$(awk '/^## [0-9]+\.[0-9]+\.[0-9]+/ {print $2; exit}' CHANGELOG.md); fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          go=true
          if [ "${{ github.event_name }}" = workflow_run ] && gh release view "v$v" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "v$v is already released: nothing to do"
            go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
  release:
    needs: decide
    if: needs.decide.outputs.go == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: ffmpeg for Tier 2 (LGPL, no network) — cached
        uses: actions/cache@v4
        with:
          path: app/build/ffmpeg
          key: ffmpeg-7.1-lgpl-nonet-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build ffmpeg (only when not cached)
        run: app/scripts/build-ffmpeg.sh
      - name: Build
        run: |
          VERSION=${{ needs.decide.outputs.version }} app/scripts/build-go.sh
          VERSION=${{ needs.decide.outputs.version }} BUILD=${{ github.run_number }} app/scripts/bundle.sh
          app/scripts/make-dmg.sh "$PWD/Laserdot-${{ needs.decide.outputs.version }}.dmg"
      - name: The packaged app launches (from the disk image, as a user would)
        run: |
          d=$(mktemp -d)
          dmg="Laserdot-${{ needs.decide.outputs.version }}.dmg"
          # hdiutil on CI machines sometimes answers "Resource temporarily
          # unavailable" for minutes: try for a while, then check the image
          # (checksums) and launch the app that went into it.
          attached=""
          for i in 1 2 3 4 5 6 7 8; do
            if hdiutil attach -nobrowse -readonly -mountpoint "$d/mnt" "$dmg"; then attached=1; break; fi
            sleep $((i * 4))
          done
          if [ -n "$attached" ]; then
            ditto "$d/mnt/Laserdot.app" "$d/Laserdot.app"
            hdiutil detach "$d/mnt" || hdiutil detach -force "$d/mnt" || true
          else
            echo "::warning::hdiutil could not attach the disk image on this machine; checking it and launching the bundled app instead"
            hdiutil verify "$dmg"
            ditto app/build/Laserdot.app "$d/Laserdot.app"
          fi
          export LASERDOT_DB="$d/data/index.db"
          "$d/Laserdot.app/Contents/MacOS/Laserdot" > "$d/app.log" 2>&1 &
          pid=$!
          sleep 8
          kill -0 "$pid" || { cat "$d/app.log"; echo "::error::Laserdot.app exited at launch"; exit 1; }
          kill "$pid"
          pkill -f "$d/Laserdot.app/Contents/MacOS/laserdotd" || true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ needs.decide.outputs.version }}
          { awk -v h="## $v" '$0 == h {on=1; next} /^## / {on=0} on' CHANGELOG.md | grep -v '<!-- quiet -->'; echo
            echo "Open the disk image and drag Laserdot to Applications. The first time, right-click Laserdot → Open (the app is not notarized). Later versions install themselves."; } > notes.md
          gh release create "v$v" "Laserdot-$v.dmg" --target "${{ needs.decide.outputs.sha }}" --title "Laserdot $v" --notes-file notes.md \
            || gh release upload "v$v" "Laserdot-$v.dmg" --clobber
