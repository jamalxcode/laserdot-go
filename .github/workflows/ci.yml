name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: Speed on a real Mac (100,000 real files)
        if: runner.os == 'macOS'
        run: app/scripts/perf-mac.sh

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build laserdotd, the CLI and the app's registry
        run: app/scripts/build-go.sh
      - name: The committed registry is current
        run: git diff --exit-code app/Sources/LaserdotKit/Registry.generated.swift
      - name: Only the updater helper may use the network (spec 7.4 exception)
        run: |
          if grep -rnE 'URLSession|NWConnection|CFNetwork|CFSocket|import Network' app/Sources --include='*.swift' | grep -v '^app/Sources/LaserdotUpdater/'; then
            echo "::error::network code outside app/Sources/LaserdotUpdater"
            exit 1
          fi
      - name: Build the app
        working-directory: app
        run: swift build
      - name: Swift tests (Swift → Unix socket → laserdotd, network denied)
        working-directory: app
        env:
          LASERDOTD: ${{ github.workspace }}/app/build/go/laserdotd
        run: swift test
      - name: ffmpeg for Tier 2 (LGPL, no network) — cached
        uses: actions/cache@v4
        with:
          path: app/build/ffmpeg
          key: ffmpeg-7.1-lgpl-nonet-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build ffmpeg (only when not cached)
        run: app/scripts/build-ffmpeg.sh
      - name: Bundle Laserdot.app
        run: |
          app/scripts/bundle.sh
          test -x app/build/Laserdot.app/Contents/MacOS/Laserdot
          test -x app/build/Laserdot.app/Contents/MacOS/laserdotd
          plutil -lint app/build/Laserdot.app/Contents/Info.plist
          codesign -dv app/build/Laserdot.app 2>&1 | grep -E "^(Identifier|Authority|Signature)=" || true
          test -x "app/build/Laserdot.app/Contents/Helpers/Laserdot Updater.app/Contents/MacOS/LaserdotUpdater"
          test -f app/build/Laserdot.app/Contents/Resources/AppIcon.icns
          # The bundled ffprobe/ffmpeg speak no network protocol.
          for t in ffprobe ffmpeg; do
            protos=$("app/build/Laserdot.app/Contents/MacOS/$t" -hide_banner -protocols | tr -d ' ' | grep -vE '^(Supportedfileprotocols:|Input:|Output:)$' | sort -u | tr '\n' ' ')
            echo "$t protocols: $protos"
            [ "$protos" = "file pipe " ] || { echo "::error::$t supports more than file and pipe: $protos"; exit 1; }
          done
          ditto -c -k --keepParent app/build/Laserdot.app Laserdot-unsigned.zip
          app/scripts/make-dmg.sh "$PWD/Laserdot.dmg"
      - name: The real app signed the way an update is on a user's Mac (its own key), then launched
        run: (cd app && LASERDOT_APP="$PWD/build/Laserdot.app" swift test --filter testSignsTheRealBuiltApp)
      - name: Launch the bundled app, as a user would (smoke test)
        run: |
          d=$(mktemp -d)
          ditto -x -k Laserdot-unsigned.zip "$d"
          export LASERDOT_DB="$d/data/index.db"
          "$d/Laserdot.app/Contents/MacOS/Laserdot" > "$d/app.log" 2>&1 &
          pid=$!
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            cat "$d/app.log"
            echo "::error::Laserdot.app exited at launch"
            exit 1
          fi
          kill "$pid"
          pkill -f "$d/Laserdot.app/Contents/MacOS/laserdotd" || true
          cat "$d/app.log"
          echo "Laserdot.app launched and kept running"
      - name: Self-test of the real app (types into the overlay; English and Arabic; screenshots)
        run: |
          fx="$(mktemp -d)/fixtures"
          mkdir -p "$fx/Projects" "$fx/Tool.app/Contents"
          sips -s format jpeg -z 256 256 app/Resources/AppIcon.png --out "$fx/beach.jpg" >/dev/null
          cp "$fx/beach.jpg" "$fx/holiday photo.jpeg"
          sips -z 256 256 app/Resources/AppIcon.png --out "$fx/photo.png" >/dev/null
          echo notes > "$fx/jpg notes.txt"
          echo plan > "$fx/project plan.txt"
          echo readme > "$fx/Projects/readme.md"
          printf '%%PDF-1.4\n%%%%EOF\n' > "$fx/project.pdf"
          echo '<plist/>' > "$fx/Tool.app/Contents/Info.plist"
          cp internal/media/testdata/dupes/clip.mp4 "$fx/clip.mp4"
          cp internal/media/testdata/song.mp3 "$fx/song.mp3"
          cp internal/media/testdata/dupes/clip.mp4 "$fx/clip copy.mp4"
          echo trash me > "$fx/trashme.txt"
          # A folder Laserdot may not read: listed under "couldn't read".
          mkdir -p "$fx/Locked" && echo x > "$fx/Locked/inside.txt" && chmod 000 "$fx/Locked"
          status=0
          for lang in en ar; do
            echo trash me > "$fx/trashme.txt" # the run before moved it to the Trash
            rm -rf "$fx/Moved Here" "$fx/renamed ok.txt" "$fx"/beach.jpg*.zip
            echo rename me > "$fx/renameme.txt"
            echo gone > "$fx/gonefile.txt"
            echo "Meeting notes: the zebra budget was approved on Monday." > "$fx/memo.txt"
            out="$(mktemp -d)"
            hold=""; [ "$lang" = en ] && hold=1
            LASERDOT_DB="$out/data/index.db" LASERDOT_SELFTEST="$out" LASERDOT_SELFTEST_FOLDER="$fx" LASERDOT_SELFTEST_HOLD=$hold \
              app/build/Laserdot.app/Contents/MacOS/Laserdot -AppleLanguages "($lang)" > "$out/app.log" 2>&1 &
            pid=$!
            if [ -n "$hold" ]; then
              # While the app holds its window open, read it as VoiceOver would.
              for i in $(seq 1 90); do [ -f "$out/hold" ] && break; sleep 1; done
              swift app/scripts/ax-dump.swift "$pid" > "$out/ax.txt" 2>&1 || true
              head -60 "$out/ax.txt"
              touch "$out/release"
            fi
            for i in $(seq 1 600); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
            if kill -0 "$pid" 2>/dev/null; then
              echo "::error::self-test ($lang) did not finish"
              # Where it is stuck: the main thread's stack.
              sample "$pid" 2 -file "$out/sample.txt" >/dev/null 2>&1 || true
              grep -A60 "Thread_.*DispatchQueue_1" "$out/sample.txt" | head -90 || true
              kill "$pid"
            fi
            pkill -f "$out/data" || true
            tail -20 "$out/app.log"
            cat "$out/report.json" || { echo "::error::no report ($lang)"; status=1; continue; }
            python3 app/scripts/check-selftest.py "$out/report.json" "$lang" || status=1
            # The screenshots, for review from the log (base64 PNG).
            for f in "$out"/*.png; do
              [ -f "$f" ] || continue
              echo "=== SCREENSHOT $lang $(basename "$f")"
              base64 -i "$f" | tr -d '\n'
              echo
              echo "=== END"
            done
          done
          exit $status
      - name: The updater finds and downloads the newest release (no token, no API)
        run: |
          d=$(mktemp -d)
          mkdir -p "$d/Old.app/Contents"
          printf '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleShortVersionString</key><string>0.0.1</string><key>CFBundleVersion</key><string>1</string></dict></plist>' > "$d/Old.app/Contents/Info.plist"
          status="$HOME/Library/Application Support/laserdot/update.json"
          rm -f "$status"
          "app/build/Laserdot.app/Contents/Helpers/Laserdot Updater.app/Contents/MacOS/LaserdotUpdater" --app "$d/Old.app"
          cat "$status"; echo
          grep -q '"state" *: *"downloaded"' "$status"
          f=$(plutil -extract file raw "$status")
          test -s "$f" && hdiutil imageinfo "$f" >/dev/null && echo "downloaded a valid disk image: $f"
          test -f "app/build/Laserdot.app/Contents/Helpers/Laserdot Updater.app/Contents/Resources/AppIcon.icns"
      - uses: actions/upload-artifact@v4
        with:
          name: Laserdot-unsigned
          path: |
            Laserdot-unsigned.zip
            Laserdot.dmg
