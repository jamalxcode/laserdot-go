name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build laserdotd, the CLI and the app's registry
        run: app/scripts/build-go.sh
      - name: The committed registry is current
        run: git diff --exit-code app/Sources/LaserdotKit/Registry.generated.swift
      - name: Only the updater helper may use the network (spec 7.4 exception)
        run: |
          if grep -rnE 'URLSession|NWConnection|CFNetwork|CFSocket|import Network' app/Sources --include='*.swift' | grep -v '^app/Sources/LaserdotUpdater/'; then
            echo "::error::network code outside app/Sources/LaserdotUpdater"
            exit 1
          fi
      - name: Build the app
        working-directory: app
        run: swift build
      - name: Swift tests (Swift → Unix socket → laserdotd, network denied)
        working-directory: app
        env:
          LASERDOTD: ${{ github.workspace }}/app/build/go/laserdotd
        run: swift test
      - name: Bundle Laserdot.app
        run: |
          app/scripts/bundle.sh
          test -x app/build/Laserdot.app/Contents/MacOS/Laserdot
          test -x app/build/Laserdot.app/Contents/MacOS/laserdotd
          plutil -lint app/build/Laserdot.app/Contents/Info.plist
          test -x "app/build/Laserdot.app/Contents/Helpers/Laserdot Updater.app/Contents/MacOS/LaserdotUpdater"
          test -f app/build/Laserdot.app/Contents/Resources/AppIcon.icns
          ditto -c -k --keepParent app/build/Laserdot.app Laserdot-unsigned.zip
          app/scripts/make-dmg.sh "$PWD/Laserdot.dmg"
      - name: Launch the bundled app, as a user would (smoke test)
        run: |
          d=$(mktemp -d)
          ditto -x -k Laserdot-unsigned.zip "$d"
          export LASERDOT_DB="$d/data/index.db"
          "$d/Laserdot.app/Contents/MacOS/Laserdot" > "$d/app.log" 2>&1 &
          pid=$!
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            cat "$d/app.log"
            echo "::error::Laserdot.app exited at launch"
            exit 1
          fi
          kill "$pid"
          pkill -f "$d/Laserdot.app/Contents/MacOS/laserdotd" || true
          cat "$d/app.log"
          echo "Laserdot.app launched and kept running"
      - uses: actions/upload-artifact@v4
        with:
          name: Laserdot-unsigned
          path: |
            Laserdot-unsigned.zip
            Laserdot.dmg
