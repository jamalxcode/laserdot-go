name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
# A newer push to the same branch replaces a run still going (its result
# would be stale anyway); main's runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Hard rule (owner): a commit is tested once. Work is tested on its branch
  # and main is fast-forwarded to the same commit; main's run then reuses
  # that passing result instead of waiting for Mac machines again, so the
  # release starts at once. Any other commit is tested in full.
  tested:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      already: ${{ steps.check.outputs.already }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          already=false
          # Documents only (docs/, issues/, README, CLAUDE.md): nothing that is
          # built or shipped changed, so no Mac is needed. CHANGELOG.md is not
          # in this list: it is bundled into the app.
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = push ] && [ -n "$before" ] && [ "$before" != 0000000000000000000000000000000000000000 ]; then
            files=$(gh api "repos/${{ github.repository }}/compare/$before...${{ github.sha }}" --jq '.files[].filename' || echo "?")
            if [ -n "$files" ] && ! echo "$files" | grep -vqE '^(docs/|issues/)|^(README|CLAUDE)\.md$'; then
              already=true
              echo "only documents changed: not building or testing"
              echo "$files"
            fi
          fi
          if [ "$already" = false ] && [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=success&per_page=20" \
                  --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }} and .event == "push")] | length')
            if [ "${n:-0}" -gt 0 ]; then already=true; fi
          fi
          echo "already=$already" >> "$GITHUB_OUTPUT"
          if [ "$already" = true ]; then echo "${{ github.sha }}: nothing to test again (documents only, or it already passed on its branch)"; fi

  test:
    needs: tested
    if: needs.tested.outputs.already != 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # The race detector on Linux covers the shared code; on the Mac (fewer,
      # slower machines) it runs for the macOS-specific packages only.
      - name: go test
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            go test ./...
            go test -race ./internal/watch ./internal/scan ./internal/sandbox ./internal/daemon
          else
            go test -race ./...
          fi
      - name: Speed on a real Mac (100,000 real files)
        if: runner.os == 'macOS'
        run: app/scripts/perf-mac.sh

  # Two Macs side by side (the owner: "make things faster"): the Arabic leg
  # runs the Swift tests and the self-test in Arabic (which used to follow the
  # English one, about 4 min); the English leg runs the rest. A change is
  # tested in about 8 minutes instead of 13.
  app:
    needs: tested
    if: needs.tested.outputs.already != 'true'
    strategy:
      fail-fast: false
      matrix:
        lang: [en, ar]
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # GitHub's keyless build proof (the same kind releases carry).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build laserdotd, the CLI and the app's registry
        run: app/scripts/build-go.sh
      - name: The committed registry is current
        if: matrix.lang == 'en'
        run: git diff --exit-code app/Sources/LaserdotKit/Registry.generated.swift
      - name: Only the updater helper may use the network (spec 7.4 exception)
        if: matrix.lang == 'en'
        run: |
          if grep -rnE 'URLSession|NWConnection|CFNetwork|CFSocket|import Network' app/Sources --include='*.swift' | grep -v '^app/Sources/LaserdotUpdater/'; then
            echo "::error::network code outside app/Sources/LaserdotUpdater"
            exit 1
          fi
      - name: Build the app
        if: matrix.lang == 'ar' # balances the two Macs
        working-directory: app
        run: swift build
      - name: Swift tests (Swift → Unix socket → laserdotd, network denied)
        if: matrix.lang == 'ar' # balances the two Macs
        working-directory: app
        env:
          LASERDOTD: ${{ github.workspace }}/app/build/go/laserdotd
        run: swift test
      - name: ffmpeg for Tier 2 (LGPL, no network) — cached
        uses: actions/cache@v4
        with:
          path: app/build/ffmpeg
          key: ffmpeg-7.1-lgpl-nonet-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build ffmpeg (only when not cached)
        run: app/scripts/build-ffmpeg.sh
      - name: Bundle Laserdot.app
        run: |
          app/scripts/bundle.sh
          test -x app/build/Laserdot.app/Contents/MacOS/Laserdot
          test -x app/build/Laserdot.app/Contents/MacOS/laserdotd
          plutil -lint app/build/Laserdot.app/Contents/Info.plist
          codesign -dv app/build/Laserdot.app 2>&1 | grep -E "^(Identifier|Authority|Signature)=" || true
          test -x "app/build/Laserdot.app/Contents/Helpers/Laserdot Updater.app/Contents/MacOS/LaserdotUpdater"
          test -f app/build/Laserdot.app/Contents/Resources/AppIcon.icns
          # The bundled ffprobe/ffmpeg speak no network protocol.
          for t in ffprobe ffmpeg; do
            protos=$("app/build/Laserdot.app/Contents/MacOS/$t" -hide_banner -protocols | tr -d ' ' | grep -vE '^(Supportedfileprotocols:|Input:|Output:)$' | sort -u | tr '\n' ' ')
            echo "$t protocols: $protos"
            [ "$protos" = "file pipe " ] || { echo "::error::$t supports more than file and pipe: $protos"; exit 1; }
          done
          ditto -c -k --keepParent app/build/Laserdot.app Laserdot-unsigned.zip
          app/scripts/make-dmg.sh "$PWD/Laserdot.dmg"
      - name: GitHub vouches for this build (keyless proof, as for releases)
        id: attest
        if: matrix.lang == 'en' && (github.event_name == 'push')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: Laserdot.dmg
      - name: The app accepts GitHub's proof for this build only (changed file, other workflow, other repo, bad signature refused)
        if: matrix.lang == 'en' && (github.event_name == 'push')
        env:
          LASERDOT_PROOF_FILE: ${{ github.workspace }}/Laserdot.dmg
          LASERDOT_PROOF_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          LASERDOT_PROOF_WORKFLOW: .github/workflows/ci.yml
        run: |
          (cd app && swift test --filter ReleaseProofTests) 2>&1 | tee proof.log
          if grep -qE "[1-9][0-9]* tests? skipped" proof.log; then echo "::error::the real proof was not checked"; exit 1; fi
      - name: The real app signed the way an update is on a user's Mac (its own key), then launched
        if: matrix.lang == 'en'
        run: (cd app && LASERDOT_APP="$PWD/build/Laserdot.app" swift test --filter testSignsTheRealBuiltApp)
      - name: Launch the bundled app, as a user would (smoke test)
        if: matrix.lang == 'en'
        run: |
          d=$(mktemp -d)
          ditto -x -k Laserdot-unsigned.zip "$d"
          export LASERDOT_DB="$d/data/index.db"
          "$d/Laserdot.app/Contents/MacOS/Laserdot" > "$d/app.log" 2>&1 &
          pid=$!
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            cat "$d/app.log"
            echo "::error::Laserdot.app exited at launch"
            exit 1
          fi
          kill "$pid"
          pkill -f "$d/Laserdot.app/Contents/MacOS/laserdotd" || true
          cat "$d/app.log"
          echo "Laserdot.app launched and kept running"
      - name: A drive Laserdot has indexed can be ejected while laserdotd runs (removable media aware)
        if: matrix.lang == 'en'
        run: |
          d=$(mktemp -d)
          # Sparse: 1 GB as far as Laserdot is concerned (it wants 512 MB free
          # before indexing a drive), a few MB on the machine.
          hdiutil create -type SPARSE -size 1g -fs APFS -volname LDEject "$d/eject" >/dev/null
          for i in 1 2 3 4 5; do hdiutil attach -nobrowse "$d/eject.sparseimage" && break; sleep $((i * 3)); done
          vol=/Volumes/LDEject
          sudo mdutil -i off "$vol" >/dev/null 2>&1 || true # Spotlight would hold it, not Laserdot
          mkdir -p "$vol/Docs" && for i in $(seq 1 200); do echo "file $i" > "$vol/Docs/note-$i.txt"; done
          db="$d/data/index.db"
          app/build/go/laserdotd --db "$db" --volume-interval 2 > "$d/daemon.log" 2>&1 &
          pid=$!
          for i in $(seq 1 50); do app/build/go/laserdot --db "$db" status 2>&1 | grep -q "not running" || break; sleep 0.2; done
          app/build/go/laserdot --db "$db" drives index "$vol"
          app/build/go/laserdot --db "$db" search note-17 | head -3
          echo "open on the drive (should be none):"; lsof +D "$vol" 2>/dev/null || true
          ok=""
          for i in 1 2 3; do hdiutil detach "$vol" && { ok=1; break; }; sleep 2; done
          kill "$pid" || true
          cat "$d/daemon.log"
          [ -n "$ok" ] || { echo "::error::the drive could not be ejected while laserdotd ran"; exit 1; }
          echo "ejected while laserdotd was running"
      - name: Self-test of the real app (types into the overlay; English and Arabic; screenshots)
        run: |
          fx="$(mktemp -d)/fixtures"
          mkdir -p "$fx/Projects" "$fx/Tool.app/Contents"
          sips -s format jpeg -z 256 256 app/Resources/AppIcon.png --out "$fx/beach.jpg" >/dev/null
          cp "$fx/beach.jpg" "$fx/holiday photo.jpeg"
          sips -z 256 256 app/Resources/AppIcon.png --out "$fx/photo.png" >/dev/null
          echo notes > "$fx/jpg notes.txt"
          echo plan > "$fx/project plan.txt"
          echo readme > "$fx/Projects/readme.md"
          mkdir -p "$fx/Trips/2023" "$fx/Trips/2024"
          echo rome > "$fx/Trips/2023/rome trip.txt"
          echo paris > "$fx/Trips/2024/paris trip.txt"
          # A zip: the names inside it are searchable.
          (cd "$(mktemp -d)" && mkdir 2023 && echo r > 2023/quokka-receipt.pdf && zip -qr "$fx/archive-2023.zip" 2023)
          printf '%%PDF-1.4\n%%%%EOF\n' > "$fx/project.pdf"
          echo '<plist/>' > "$fx/Tool.app/Contents/Info.plist"
          cp internal/media/testdata/dupes/clip.mp4 "$fx/clip.mp4"
          cp internal/media/testdata/song.mp3 "$fx/song.mp3"
          cp internal/media/testdata/dupes/clip.mp4 "$fx/clip copy.mp4"
          echo trash me > "$fx/trashme.txt"
          # A gallery big enough for the calm choices to leave some out (the
          # owner's real searches): ten folders of pictures, each a size and
          # shape of its own (portrait, landscape, square; SD to 1080p).
          i=0
          for f in Coast City Forest Desert Snow River Night Garden Market Harbour; do
            mkdir -p "$fx/Gallery/$f"
            for wh in "480 640" "1080 1920" "300 300"; do
              i=$((i+1)); set -- $wh
              sips -z "$(( $1 + i ))" "$(( $2 + i ))" app/Resources/AppIcon.png --out "$fx/Gallery/$f/sunset-$i.png" >/dev/null
            done
          done
          # A Ulysses sheet: a package, so the picture inside is not a result.
          mkdir -p "$fx/Writing/a1b2c3.ulysses/Media"
          cp "$fx/Gallery/Coast/sunset-1.png" "$fx/Writing/a1b2c3.ulysses/Media/sunset-inside.png"
          # A folder Laserdot may not read: listed under "couldn't read".
          mkdir -p "$fx/Locked" && echo x > "$fx/Locked/inside.txt" && chmod 000 "$fx/Locked"
          status=0
          for lang in ${{ matrix.lang }}; do
            echo trash me > "$fx/trashme.txt" # the run before moved it to the Trash
            rm -rf "$fx/Moved Here" "$fx/renamed ok.txt" "$fx"/beach.jpg*.zip
            echo rename me > "$fx/renameme.txt"
            echo gone > "$fx/gonefile.txt"
            echo stale > "$fx/staleme.txt"
            echo "Meeting notes: the zebra budget was approved on Monday." > "$fx/memo.txt"
            out="$(mktemp -d)"
            hold=""; [ "$lang" = en ] && hold=1
            LASERDOT_DB="$out/data/index.db" LASERDOT_SELFTEST="$out" LASERDOT_SELFTEST_FOLDER="$fx" LASERDOT_SELFTEST_HOLD=$hold \
              app/build/Laserdot.app/Contents/MacOS/Laserdot -AppleLanguages "($lang)" > "$out/app.log" 2>&1 &
            pid=$!
            if [ -n "$hold" ]; then
              # While the app holds its window open, read it as VoiceOver would.
              for i in $(seq 1 90); do [ -f "$out/hold" ] && break; sleep 1; done
              swift app/scripts/ax-dump.swift "$pid" > "$out/ax.txt" 2>&1 || true
              head -60 "$out/ax.txt"
              touch "$out/release"
            fi
            for i in $(seq 1 600); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
            if kill -0 "$pid" 2>/dev/null; then
              echo "::error::self-test ($lang) did not finish"
              # Where it is stuck: the main thread's stack.
              sample "$pid" 2 -file "$out/sample.txt" >/dev/null 2>&1 || true
              grep -A60 "Thread_.*DispatchQueue_1" "$out/sample.txt" | head -90 || true
              kill "$pid"
            fi
            pkill -f "$out/data" || true
            tail -20 "$out/app.log"
            cat "$out/report.json" || { echo "::error::no report ($lang)"; status=1; continue; }
            python3 app/scripts/check-selftest.py "$out/report.json" "$lang" || status=1
            # The screenshots, for review from the log (base64 PNG).
            for f in "$out"/*.png; do
              [ -f "$f" ] || continue
              echo "=== SCREENSHOT $lang $(basename "$f")"
              base64 -i "$f" | tr -d '\n'
              echo
              echo "=== END"
            done
          done
          exit $status
      - name: Real situation — eject a drive from Finder while the app is indexing it
        if: matrix.lang == 'en'
        # After the self-test: macOS finishing this eject must not disturb it.
        run: |
          # The owner's case: the app runs, a drive is being indexed, and the
          # drive is ejected the usual way (diskutil = Finder's eject). The app
          # must let go (DiskArbitration approval) so the eject succeeds.
          d=$(mktemp -d)
          hdiutil create -type SPARSE -size 1g -fs APFS -volname LDBusy "$d/busy" >/dev/null
          for i in 1 2 3 4 5; do hdiutil attach -nobrowse "$d/busy.sparseimage" && break; sleep $((i * 3)); done
          vol=/Volumes/LDBusy
          sudo mdutil -i off "$vol" >/dev/null 2>&1 || true
          python3 -c "
          import os
          for a in range(60):
              for b in range(10):
                  p = '$vol/a%d/b%d' % (a, b)
                  os.makedirs(p, exist_ok=True)
                  for f in range(50):
                      open('%s/file %d.txt' % (p, f), 'w').close()
          "
          db="$d/data/index.db"
          LASERDOT_DB="$db" app/build/Laserdot.app/Contents/MacOS/Laserdot > "$d/app.log" 2>&1 &
          app=$!
          for i in $(seq 1 60); do app/build/go/laserdot --db "$db" status 2>&1 | grep -q "not running" || break; sleep 0.5; done
          app/build/go/laserdot --db "$db" drives index "$vol" > "$d/index.log" 2>&1 &
          for i in $(seq 1 100); do app/build/go/laserdot --db "$db" drives | grep -q "LDBusy.*indexing" && break; sleep 0.1; done
          app/build/go/laserdot --db "$db" drives || true
          start=$(date +%s)
          ok=""
          for i in 1 2 3; do diskutil eject "$vol" && { ok=1; break; }; sleep 2; done
          took=$(( $(date +%s) - start ))
          kill -0 "$app" 2>/dev/null && alive=1 || alive=""
          kill "$app" 2>/dev/null || true
          pkill -f "$d/data" || true
          tail -20 "$d/app.log"; cat "$d/index.log" || true
          [ -n "$ok" ] || { echo "::error::the drive could not be ejected while the app indexed it"; exit 1; }
          [ -n "$alive" ] || { echo "::error::the app did not survive the eject"; exit 1; }
          echo "ejected mid-index in ${took}s, the app still running"
      - name: The updater finds and downloads the newest release (no token, no API)
        if: matrix.lang == 'en'
        env:
          GH_TOKEN: ${{ github.token }} # only for this check's `gh release view`
        run: |
          d=$(mktemp -d)
          mkdir -p "$d/Old.app/Contents"
          printf '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleShortVersionString</key><string>0.0.1</string><key>CFBundleVersion</key><string>1</string></dict></plist>' > "$d/Old.app/Contents/Info.plist"
          status="$HOME/Library/Application Support/laserdot/update.json"
          rm -f "$status"
          "app/build/Laserdot.app/Contents/Helpers/Laserdot Updater.app/Contents/MacOS/LaserdotUpdater" --app "$d/Old.app"
          cat "$status"; echo
          grep -q '"state" *: *"downloaded"' "$status"
          f=$(plutil -extract file raw "$status")
          test -s "$f" && hdiutil imageinfo "$f" >/dev/null && echo "downloaded a valid disk image: $f"
          # Releases since 0.9.9 carry GitHub's build proof; the helper fetches it too.
          if gh release view --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -q 'sigstore.json$'; then
            test -s "$f.sigstore.json" && echo "and its build proof"
          else
            echo "the newest release predates build proofs"
          fi
          test -f "app/build/Laserdot.app/Contents/Helpers/Laserdot Updater.app/Contents/Resources/AppIcon.icns"
      - uses: actions/upload-artifact@v4
        if: matrix.lang == 'en'
        with:
          name: Laserdot-unsigned
          path: |
            Laserdot-unsigned.zip
            Laserdot.dmg
